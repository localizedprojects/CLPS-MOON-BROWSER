# Tests on every push and pull request: Flutter app, chart bundle, Python pipeline.
# The pipeline tests run offline; tests that need SPICE kernels or LOLA DEMs skip
# when those large downloads are absent (they are never committed).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the older run, so cancel it.
# Safe here because CI only tests; the Pages deploy (deploy-pages.yml) never cancels.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  charts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: charts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # the built bundle is committed (app/assets/charts); fail if it is stale
      - run: npm run build
      - run: git diff --exit-code -- ../app/assets/charts/index.html

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
