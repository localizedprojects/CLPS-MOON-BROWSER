# Publishes the Flutter web build to GitHub Pages on every push to main.
# Enable it once in the repository: Settings > Pages > Source: GitHub Actions.
# The base href is the repository name, so the app works at
# https://<owner>.github.io/<repo>/ ; routes are hash-based (#/site/<id>), so
# no SPA fallback page is needed.
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a Pages deployment that is already running (GitHub starter-workflow advice);
# a newer push queues behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
